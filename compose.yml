services:
  postgres:
    image: postgres:16-alpine
    container_name: cafe_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    
  backend:
    build: 
      context: .
      dockerfile: ./Dockerfile
    environment:
      - NODE_ENV=desarrollo
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2' #Se topea para el uso de 200% pensando en que como minimo se ejecutara en un I3 o ryzen3 de 4 nucleos
          memory: 512M #Dado la version inicial y que no se esta usando Java con Springboot se decide topear en 512MB de uso permitido de RAM
    ports:
      - ${PUERTO}:${PUERTO}
    env_file:
      - .env

volumes:
  pgdata:
