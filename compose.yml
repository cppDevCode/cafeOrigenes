services:
  postgres:
    image: postgres:16-alpine
    container_name: cafe_postgres
    restart: always
    environment:
      POSTGRES_USER: origenes
      POSTGRES_PASSWORD: cafe
      POSTGRES_DB: cafe_origenes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
